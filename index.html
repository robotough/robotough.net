<script>
'use strict';
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W,H,SCALE,F,img,buf,zb;
const rand=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
function hex(h){const n=parseInt(h.slice(1),16);return (0xff000000|((n&255)<<16)|(n&0xff00)|(n>>16&255))>>>0}
const ramp=a=>Uint32Array.from(a,hex);
const BLACK=hex('#000000');
const BAY=[0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5].map(v=>(v+.5)/16);

// ---------- vector math ----------
const sub=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]];
const add=(a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]];
const scl=(a,s)=>[a[0]*s,a[1]*s,a[2]*s];
const dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
const cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
const norm=a=>{const l=Math.hypot(a[0],a[1],a[2])||1;return [a[0]/l,a[1]/l,a[2]/l]};
const mulR=(R,v)=>[R[0]*v[0]+R[1]*v[1]+R[2]*v[2],R[3]*v[0]+R[4]*v[1]+R[5]*v[2],R[6]*v[0]+R[7]*v[1]+R[8]*v[2]];
function mul3(A,B){const C=new Array(9);for(let i=0;i<3;i++)for(let j=0;j<3;j++)C[i*3+j]=A[i*3]*B[j]+A[i*3+1]*B[3+j]+A[i*3+2]*B[6+j];return C}
function euler(yaw,pitch,roll){
  const cy=Math.cos(yaw),sy=Math.sin(yaw),cp=Math.cos(pitch),sp=Math.sin(pitch),cr=Math.cos(roll),sr=Math.sin(roll);
  return mul3([cy,0,sy,0,1,0,-sy,0,cy],mul3([1,0,0,0,cp,-sp,0,sp,cp],[cr,-sr,0,sr,cr,0,0,0,1]));
}

// ---------- model building ----------
function tri(m,a,b,c,mat,ref){
  let n=cross(sub(b,a),sub(c,a));const L=Math.hypot(n[0],n[1],n[2]);if(L<1e-7)return;
  n=[n[0]/L,n[1]/L,n[2]/L];
  const cen=[(a[0]+b[0]+c[0])/3,(a[1]+b[1]+c[1])/3,(a[2]+b[2]+c[2])/3];
  if(dot(n,sub(cen,ref))<0){[b,c]=[c,b];n=[-n[0],-n[1],-n[2]]}
  m.tris.push({v:[a,b,c],n,mat});
}
const quad=(m,a,b,c,d,mat,ref)=>{tri(m,a,b,c,mat,ref);tri(m,a,c,d,mat,ref)};
// stations front-to-back; last station gets a rear cap
function loft(m,st,sides,mat,xo,yo,capMat,rot0){
  const r0=rot0===undefined?Math.PI/sides:rot0;
  const rings=st.map(s=>{const r=[];for(let k=0;k<sides;k++){const a=k/sides*Math.PI*2+r0;r.push([xo+Math.cos(a)*s.rx,yo+s.yo+Math.sin(a)*s.ry,s.z])}return r});
  for(let i=0;i<st.length-1;i++){
    const A=rings[i],B=rings[i+1],ref=[xo,yo+(st[i].yo+st[i+1].yo)/2,(st[i].z+st[i+1].z)/2];
    for(let k=0;k<sides;k++){const k2=(k+1)%sides;quad(m,A[k],A[k2],B[k2],B[k],mat,ref)}
  }
  const l=st[st.length-1],R=rings[rings.length-1];
  if(l.rx>0){const c=[xo,yo+l.yo,l.z],ref=[xo,yo+l.yo,l.z+1];for(let k=0;k<sides;k++)tri(m,c,R[k],R[(k+1)%sides],capMat||mat,ref)}
}
function hexa(m,t,b,mat){
  const ref=[0,0,0];for(const p of [...t,...b]){ref[0]+=p[0]/8;ref[1]+=p[1]/8;ref[2]+=p[2]/8}
  quad(m,t[0],t[1],t[2],t[3],mat,ref);quad(m,b[0],b[1],b[2],b[3],mat,ref);
  for(let k=0;k<4;k++){const k2=(k+1)%4;quad(m,t[k],t[k2],b[k2],b[k],mat,ref)}
}
function plate(m,pts,off,mat){hexa(m,pts.map(p=>add(p,off)),pts.map(p=>sub(p,off)),mat)}

function buildFighter(){
  const m={tris:[],lights:[],engines:[]};
  // fuselage: flattened, angular
  loft(m,[{z:3.3,rx:0,ry:0,yo:-.02},{z:2.4,rx:.24,ry:.13,yo:0},{z:1.2,rx:.46,ry:.24,yo:.04},{z:0,rx:.58,ry:.3,yo:.06},{z:-.7,rx:.62,ry:.32,yo:.06}],6,'hull',0,0,'panel');
  // canopy
  loft(m,[{z:1.9,rx:0,ry:0,yo:0},{z:1.3,rx:.17,ry:.1,yo:0},{z:.5,rx:.2,ry:.12,yo:0},{z:-.1,rx:0,ry:0,yo:0}],6,'glass',0,.27);
  // engine block
  hexa(m,
    [[-.95,.28,-.4],[.95,.28,-.4],[1.0,.3,-1.8],[-1.0,.3,-1.8]],
    [[-.95,-.3,-.4],[.95,-.3,-.4],[1.0,-.34,-1.8],[-1.0,-.34,-1.8]],'panel');
  // nozzles (square), three across plus two small below
  const noz=[[-.6,0,.26],[0,0,.28],[.6,0,.26],[-.32,-.25,.13],[.32,-.25,.13]];
  for(const [x,y,r] of noz){
    loft(m,[{z:-1.7,rx:r,ry:r*.9,yo:0},{z:-2.05,rx:r*1.1,ry:r,yo:0}],4,'hull',x,y,'engine',Math.PI/4);
    m.engines.push([x,y,-2.07,r]);
  }
  // swept wings
  for(const s of [-1,1]){
    const P=u=>({x:.5+2.4*u,zf:.8-1.9*u,zb:-1.5-.2*u,y:-.02-.18*u,th:.13-.09*u});
    const seg=(u0,u1,mat)=>{const a=P(u0),b=P(u1);
      const t=[[s*a.x,a.y+a.th/2,a.zf],[s*b.x,b.y+b.th/2,b.zf],[s*b.x,b.y+b.th/2,b.zb],[s*a.x,a.y+a.th/2,a.zb]];
      hexa(m,t,t.map((p,i)=>[p[0],p[1]-(i===0||i===3?a:b).th,p[2]]),mat)};
    seg(0,.55,'hull');seg(.55,.85,'panel');seg(.85,1,'hull');
    // wingtip down-fin
    plate(m,[[s*2.9,-.2,-.9],[s*2.95,-.2,-1.7],[s*3.05,-.75,-1.95],[s*3.0,-.75,-1.4]],[s*.03,0,0],'trim');
    // tall canted tail fin
    plate(m,[[s*.55,.28,-.6],[s*1.05,1.35,-1.55],[s*1.12,1.35,-2.05],[s*.62,.28,-1.85]],[s*.035,-.02,0],'trim');
    // side intake
    loft(m,[{z:.6,rx:.12,ry:.14,yo:0},{z:-.4,rx:.16,ry:.18,yo:0}],4,'panel',s*.6,-.08,'panel',Math.PI/4);
    // blue running lights
    m.lights.push({p:[s*3.02,-.76,-1.93],blink:0},{p:[s*1.12,1.37,-2.06],blink:0},{p:[s*1.8,.0,-1.62],blink:0},{p:[s*.95,.3,-1.81],blink:0},{p:[s*2.95,-.2,-.95],blink:s>0?1:2});
  }
  m.lights.push({p:[0,.38,-1.2],blink:3});
  return m;
}

// Skins. 'blue' is the original ship, kept for later.
// ---------- cosmetics ----------
// Paint = hull colors, Exhaust = engine glow + plume, Lasers = bolt color. Each is bought and equipped separately.
const pal=(hull,panel,glass,light)=>({hull,panel,trim:panel,glass,light});
const SKINS={
  red:pal(['#140f11','#2e2729','#5a5254','#948d8d','#cfcac8','#ffffff'],['#12040a','#2e0710','#5c0e18','#951a22','#cc2a2c','#f25a44'],['#05070d','#101a2c','#1f3552','#3d6488','#9cc8ec'],['#4a0c0c','#ff4a3a','#ffe0d0']),
  blue:{hull:['#06070b','#0e1019','#191d2c','#283047','#3f4c6e','#6a7ea8'],panel:['#040509','#0a0c13','#12151f','#1d2230','#2d3549'],
        trim:['#06070b','#0e1019','#191d2c','#283047','#3f4c6e','#6a7ea8'],glass:['#050a14','#0c1d33','#173a5c','#2f6b91','#7fc4e0'],light:['#1a3a8a','#3f7fff','#a8d0ff']},
  arctic:pal(['#0e1216','#243038','#4c6070','#8aa4b4','#c8dce6','#ffffff'],['#021018','#06303e','#0c5a6e','#1690a8','#38c8dc','#9af4ff'],['#040a14','#0c1e36','#1a3c64','#3a70a0','#a0d8ff'],['#0c3a4a','#38e0ff','#d0ffff']),
  gunmetal:pal(['#0a0b0d','#1a1c20','#2e3238','#4a5058','#707a84','#a4aeb8'],['#1a0802','#3e1404','#7a2a08','#c04810','#f07020','#ffb070'],['#06080a','#141c24','#263444','#44607a','#9ab8d0'],['#4a1a04','#ff8a2a','#ffe0b0']),
  hornet:pal(['#050505','#0e0e0e','#1c1c1c','#2e2e2e','#474747','#6a6a6a'],['#1a1402','#3e3004','#7a5e06','#c09208','#f0c020','#ffe66a'],['#140c02','#3a2206','#6a4410','#a8741e','#ffd080'],['#4a3a04','#ffd020','#fff4b0']),
  viper:pal(['#060a06','#0e1a10','#1c3020','#2e4a32','#4a6e4c','#7aa27a'],['#081402','#163006','#2e5c0a','#4c9410','#7cc81c','#c0f060'],['#040a06','#0c2014','#184028','#2e6c46','#8ae0a8'],['#0e3a06','#6aff3a','#e0ffc0']),
  royal:pal(['#0c0612','#1c0e2a','#321a4a','#4e2c70','#7448a0','#a47ad0'],['#1a1004','#3e2808','#7a5010','#b8801c','#e8b034','#fff0a0'],['#0a0614','#1e1236','#38245e','#5e4494','#c8a8ff'],['#3a2a04','#ffd24a','#fff4c0']),
};
const EXHAUSTS={
  flame:{eng:['#b83a10','#ff7a1a','#ffb347','#ffe9b0'],exh:['#ffffff','#fff2c0','#ffd070','#ff9a3a','#e0502a','#9a2020','#401010']},
  ion:{eng:['#1a4ab8','#3f8cff','#8fd0ff','#e0f6ff'],exh:['#ffffff','#d8f6ff','#8fdcff','#4aa6f0','#2a64c0','#153572','#0a1a3c']},
  plasma:{eng:['#1a8a2a','#3fe04a','#a0ff8a','#f0ffe0'],exh:['#ffffff','#e8ffd8','#a8ff90','#50e060','#20a040','#0c5a24','#04240e']},
  void:{eng:['#6a1ab8','#a44aff','#d8a0ff','#f6e8ff'],exh:['#ffffff','#f2e0ff','#d0a0ff','#9a5af0','#6a2ac0','#3a1672','#180a34']},

// ---------- camera ----------
const CAM={pos:[0,0,0],r:[1,0,0],u:[0,1,0],f:[0,0,1]};
function setCam(){
  CAM.pos=[4.6,2.6,-13];
  const T=[-.4,-.2,0];
  CAM.f=norm(sub(T,CAM.pos));CAM.r=norm(cross([0,1,0],CAM.f));CAM.u=cross(CAM.f,CAM.r);
  DIRC=[CAM.r[2],CAM.u[2],CAM.f[2]];   // world forward (+z) expressed in camera space
}
let DIRC=[0,0,1];
function proj(p){
  const dx=p[0]-CAM.pos[0],dy=p[1]-CAM.pos[1],dz=p[2]-CAM.pos[2];
  const cz=dx*CAM.f[0]+dy*CAM.f[1]+dz*CAM.f[2];if(cz<.25)return null;
  const cx=dx*CAM.r[0]+dy*CAM.r[1]+dz*CAM.r[2],cy=dx*CAM.u[0]+dy*CAM.u[1]+dz*CAM.u[2];
  return {x:W/2+cx*F/cz,y:H/2-cy*F/cz,w:1/cz};
}

// ---------- rasterizer ----------
let engFlick=0;
function raster(a,b,c,rp,l){
  const minx=Math.max(0,Math.floor(Math.min(a.x,b.x,c.x))),maxx=Math.min(W-1,Math.ceil(Math.max(a.x,b.x,c.x)));
  const miny=Math.max(0,Math.floor(Math.min(a.y,b.y,c.y))),maxy=Math.min(H-1,Math.ceil(Math.max(a.y,b.y,c.y)));
  if(minx>maxx||miny>maxy)return;
  const area=(b.x-a.x)*(c.y-a.y)-(b.y-a.y)*(c.x-a.x);if(Math.abs(area)<1e-9)return;
  const inv=1/area,n=rp?rp.length:ENGC.length;
  for(let y=miny;y<=maxy;y++){const py=y+.5;
    for(let x=minx;x<=maxx;x++){const px=x+.5;
      const w0=((b.x-px)*(c.y-py)-(b.y-py)*(c.x-px))*inv;if(w0<0)continue;
      const w1=((c.x-px)*(a.y-py)-(c.y-py)*(a.x-px))*inv;if(w1<0)continue;
      const w2=1-w0-w1;if(w2<0)continue;
      const z=w0*a.w+w1*b.w+w2*c.w,i=y*W+x;if(z<=zb[i])continue;zb[i]=z;
      const th=BAY[(x&3)|((y&3)<<2)];
      if(rp){buf[i]=rp[clamp(Math.floor(l*(n-1)+.2+th*.6),0,n-1)]}
      else buf[i]=ENGC[clamp(Math.floor(engLvl+engFlick*(.3+.7*THR)+th),0,n-1)];
    }}
}
function drawMesh(m,pos,R,sc=1){
  for(const t of m.tris){
    const n=mulR(R,t.n),w0=add(scl(mulR(R,t.v[0]),sc),pos);
    if(dot(n,sub(CAM.pos,w0))<=0)continue;
    const a=proj(w0),b=proj(add(scl(mulR(R,t.v[1]),sc),pos)),c=proj(add(scl(mulR(R,t.v[2]),sc),pos));
    if(!a||!b||!c)continue;
    const l=AMB+(1-AMB)*Math.max(0,dot(n,LIGHT));
    raster(a,b,c,t.mat==='engine'?null:MATS[t.mat],l);
  }
}

// ---------- modular ship parts ----------
// A ship is a nose + hull + wings + engine. Parts meet at two fixed hexagonal joints so any mix lines up:
// the nose ends on J1 (z=1), the hull runs J1 -> J2 (z=-1), the engine bolts onto J2, and wing roots sit
// inside the hull (|x|<=.2). Wings also carry the gun mounts. +z is forward, +y up.
const PI2=Math.PI*2;
const J1={z:1,rx:.4,ry:.25,yo:.04},J2={z:-1,rx:.56,ry:.3,yo:.05};
const S_=(z,rx,ry,yo=0)=>({z,rx,ry,yo});
const lit=(m,p,blink=0)=>m.lights.push({p,blink});
const W_=(x,zf,zb,y,th)=>({x,zf,zb,y,th});
function wingSeg(m,s,a,b,mat){const t=[[s*a.x,a.y+a.th/2,a.zf],[s*b.x,b.y+b.th/2,b.zf],[s*b.x,b.y+b.th/2,b.zb],[s*a.x,a.y+a.th/2,a.zb]];
  hexa(m,t,t.map((p,i)=>[p[0],p[1]-(i===0||i===3?a:b).th,p[2]]),mat)}
// chain of wing segments: pts are W_ stations root to tip, mats one per gap
function wingChain(m,s,pts,mats){for(let i=0;i<pts.length-1;i++)wingSeg(m,s,pts[i],pts[i+1],mats[i]||mats[mats.length-1])}
function nozzle(m,x,y,z,r,sides=4){loft(m,[{z:z+.35,rx:r,ry:r*.9,yo:0},{z,rx:r*1.1,ry:r,yo:0}],sides,'hull',x,y,'engine',sides===4?Math.PI/4:undefined);m.engines.push([x,y,z-.02,r])}
// axis-aligned box
function box(m,x0,x1,y0,y1,z0,z1,mat){
  hexa(m,[[x0,y1,z1],[x1,y1,z1],[x1,y1,z0],[x0,y1,z0]],[[x0,y0,z1],[x1,y0,z1],[x1,y0,z0],[x0,y0,z0]],mat)}
// prism through convex cross-sections (front to back), both ends capped
function prism(m,rings,mat,capF=mat,capB=mat){
  const n=rings[0].p.length,R=rings.map(r=>r.p.map(([x,y])=>[x,y,r.z]));
  const cen=a=>{const c=[0,0,0];for(const p of a)for(let k=0;k<3;k++)c[k]+=p[k]/a.length;return c};
  for(let i=0;i<R.length-1;i++){const c=cen([...R[i],...R[i+1]]);
    for(let k=0;k<n;k++){const k2=(k+1)%n;quad(m,R[i][k],R[i][k2],R[i+1][k2],R[i+1][k],mat,c)}}
  const cap=(ring,dz,mt)=>{if(!mt)return;const c=cen(ring),ref=[c[0],c[1],c[2]-dz];for(let k=0;k<n;k++)tri(m,c,ring[k],ring[(k+1)%n],mt,ref)};
  cap(R[0],1,capF);cap(R[R.length-1],-1,capB);
}
const rect=(cx,cy,hw,hh)=>[[cx-hw,cy-hh],[cx+hw,cy-hh],[cx+hw,cy+hh],[cx-hw,cy+hh]];
// round-ish tube along z, front and back capped
function tube(m,x,y,st,sides,mat,capF,capB){
  const ring=s=>Array.from({length:sides},(_,k)=>{const a=(k+.5)/sides*PI2;return [x+Math.cos(a)*s.rx,y+s.yo+Math.sin(a)*s.ry]});
  prism(m,st.map(s=>({z:s.z,p:ring(s)})),mat,capF,capB)}
// flat polygonal ring around the z axis (halo frames, ring wings)
function hoop(m,z,r,ry,depth,th,n,mat,cy=0,rot=0){
  for(let k=0;k<n;k++){const a0=k/n*PI2+rot,a1=(k+1)/n*PI2+rot;
    const P=(a,rr,zz)=>[Math.cos(a)*rr,cy+Math.sin(a)*rr*ry/r,zz];
    hexa(m,[P(a0,r,z+depth/2),P(a1,r,z+depth/2),P(a1,r,z-depth/2),P(a0,r,z-depth/2)],
           [P(a0,r-th,z+depth/2),P(a1,r-th,z+depth/2),P(a1,r-th,z-depth/2),P(a0,r-th,z-depth/2)],mat)}}

const owns=it=>it.free||OWNED[it.id];
const skinsOwned=()=>SHOP.filter(it=>it.kind==='skin'&&owns(it)).map(it=>it.key);
// Each of the 3 fighters (lead + 2 wingmen) has its own loadout. Owned items work on any fighter;
// Customize picks which fighter you're editing (EDIT), and the shop equips to that one too.

const defLoad=()=>({...DEFAULT_SHIP,skin:'red',exhaust:'flame',laser:'red'});

function paletteFor(c){const k=c.skin+'|'+c.exhaust+'|'+c.laser;if(PAL_CACHE[k])return PAL_CACHE[k];
  const S=SKINS[c.skin],E=EXHAUSTS[c.exhaust];

    ENGC:ramp([shade(E.eng[0],.12),shade(E.eng[0],.25),shade(E.eng[0],.48),...E.eng]),EXH:ramp(E.exh),BOLT:ramp(LASERS[c.laser])}}
// the lead ship's loadout also drives the global ship/palette (guns, laser color, debris fire)
function syncLead(){const L=LOADOUTS[0];SHIPCFG={nose:L.nose,hull:L.hull,wing:L.wing,eng:L.eng};SHIP=buildShip(SHIPCFG);applySkin(L.skin);applyExhaust(L.exhaust);applyLaser(L.laser)}
// keep only what's owned; anything else falls back to base

const EQUIP=Object.fromEntries(LOAD_KINDS.map(k=>[k,v=>{cur()[k]=v;syncLead()}]));

function save(){try{localStorage.setItem('drift.save',JSON.stringify({dist:DIST,credits:CREDITS,fuel:FUEL,exhaust:EXHAUST,laser:LASER,ship:SHIPCFG,loadouts:LOADOUTS,owned:OWNED,wing:FLEET.length-1,skin:SKIN}))}catch(e){}}
let scan=0,STARS=[],PARTS=[],T=0,V=22,paused=false,cov,showCov=false;
const FAR=420,NEAR=1.5,STALE=300;
const COVC=Uint32Array.from({length:64},(_,k)=>(0xff000000|(30+((225*k/63)|0)))>>>0);   // coverage-map reds, dark to bright   // STALE: seconds a pixel may go unlit

// The lead ship roams a slow Lissajous path, but only inside the bottom-left quadrant.
// Its path is defined in screen space, then projected back into the world at a depth that
// keeps the whole ship (wings and fins) inside the quadrant on any screen shape.
const TAU=Math.PI*2, HALF_W=3.9, HALF_H=2.9, SIZE=1.5;
// measured on-screen extents of the ship around its anchor point, left/right/up/down (units at depth 1)
const EXT={l:4.3,r:2.8,u:1.5,d:3.2};
function wander(t){
  const m=H*.03;
  const fit=Math.max((EXT.l+EXT.r)*F/(W/2-2*m),(EXT.u+EXT.d)*F/(H/2-2*m)); // closest depth that still fits the quadrant
  const d0=Math.max(fit,Math.max(HALF_W*F/(W*.15),HALF_H*F/(H*.15))/SIZE);
  const d=d0*(1+.08*(1+Math.sin(t*TAU/131+2)));
  const L=EXT.l*F/d,R=EXT.r*F/d,U=EXT.u*F/d,D=EXT.d*F/d;
  const u=.5+.5*Math.sin(t*TAU/97)*.95,v=.5+.5*Math.sin(t*TAU/71+1)*.95;
  const sx=m+L+u*Math.max(0,W/2-L-R-2*m),sy=H/2+m+U+v*Math.max(0,H/2-U-D-2*m);
  return add(CAM.pos,add(scl(CAM.f,d),add(scl(CAM.r,(sx-W/2)*d/F),scl(CAM.u,-(sy-H/2)*d/F))));
}
function pose(s,t){
  const o=SLOTS[s.slot],q=t+s.ph,w=wander(t),a=wander(t-.5),b=wander(t+.5);
  const vx=b[0]-a[0],vy=b[1]-a[1];
  const pos=[w[0]+o[0]+Math.sin(q*.61)*.08,w[1]+o[1]+Math.sin(q*.7)*.08,w[2]+o[2]];
  return {pos,R:euler(vx*.12,-vy*.15+Math.sin(q*.5)*.03,-vx*.6+Math.sin(q*.9)*.02)};
}

// Stars live in camera space. Filling the view frustum evenly (not a tube) gives an even
// on-screen density with no clump at the center. New stars spawn at whichever of a few
// random screen spots has gone longest without being lit, so coverage stays even.
function spawnStar(cz){
  let bx=0,by=0,bt=Infinity;
  for(let i=0;i<8;i++){const sx=Math.random()*W,sy=Math.random()*H,t=cov[(sy|0)*W+(sx|0)];if(t<bt){bt=t;bx=sx;by=sy}}
  return {x:(bx-W/2)*cz/F,y:-(by-H/2)*cz/F,z:cz};
}
// On resize, keep the stars that exist (their 3D positions stay valid) and only top up or trim the count,
// so the field doesn't get reshuffled every time the window changes size.
function fillStars(){const n=Math.round(W*H/400);while(STARS.length<n)STARS.push(spawnStar(FAR*Math.cbrt(Math.random())+NEAR));STARS.length=n}

function resize(){
  const iw=innerWidth,ih=innerHeight;
  SCALE=Math.max(2,Math.round(ih/200));H=Math.ceil(ih/SCALE);W=Math.ceil(iw/SCALE);
  cv.width=W;cv.height=H;cv.style.width=W*SCALE+'px';cv.style.height=H*SCALE+'px';
  img=ctx.createImageData(W,H);buf=new Uint32Array(img.data.buffer);zb=new Float32Array(W*H);F=H*1.15;
  cov=new Float32Array(W*H).fill(T);scan=0;setCam();fillStars();   // a new size starts with a fresh coverage clock
}

// ---------- asteroids ----------
// Rare fly-bys (one every 40-90 s). Click one and the lead ship fires; a hit pays far more than idling.
let ROCKS=[],BOLTS=[],DEBRIS=[],rockT=rand(20,40);
function buildRock(mat='rock'){
  const g=(1+Math.sqrt(5))/2;
  let vs=[[-1,g,0],[1,g,0],[-1,-g,0],[1,-g,0],[0,-1,g],[0,1,g],[0,-1,-g],[0,1,-g],[g,0,-1],[g,0,1],[-g,0,-1],[-g,0,1]];
  const fs=[[0,11,5],[0,5,1],[0,1,7],[0,7,10],[0,10,11],[1,5,9],[5,11,4],[11,10,2],[10,7,6],[7,1,8],[3,9,4],[3,4,2],[3,2,6],[3,6,8],[3,8,9],[4,9,5],[2,4,11],[6,2,10],[8,6,7],[9,8,1]];
  const sq=rand(.65,1);vs=vs.map(v=>{const n=norm(v),r=rand(.72,1.12);return [n[0]*r,n[1]*r*sq,n[2]*r]});
  const m={tris:[]};for(const f of fs)tri(m,vs[f[0]],vs[f[1]],vs[f[2]],mat,[0,0,0]);return m;
}
function axisRot(ax,a){const [x,y,z]=ax,c=Math.cos(a),s=Math.sin(a),t=1-c;
  return [t*x*x+c,t*x*y-s*z,t*x*z+s*y,t*x*y+s*z,t*y*y+c,t*y*z-s*x,t*x*z-s*y,t*y*z+s*x,t*z*z+c]}
const GOLD_CHANCE=1/77,GOLD_REWARD=121;
function spawnRock(forceGold){
  // enter somewhere outside the ship's bottom-left quadrant
  // start near the middle so it drifts across a good part of the screen, heading away from the ship's corner
  let u,v;do{u=Math.random();v=Math.random()}while(u<.5&&v>.5);
  const cz=260,sx=W/2+(u-.5)*W*.4,sy=H/2+(v-.5)*H*.4,size=rand(1.5,3.5);
  const pos=add(CAM.pos,add(scl(CAM.f,cz),add(scl(CAM.r,(sx-W/2)*cz/F),scl(CAM.u,-(sy-H/2)*cz/F))));
  const gold=forceGold||Math.random()<GOLD_CHANCE;
  ROCKS.push({pos,size,gold,mesh:buildRock(gold?'gold':'rock'),ax:norm([rand(-1,1),rand(-1,1),rand(-1,1)]),ang:0,spin:rand(.4,1.4),hit:false,
    reward:gold?GOLD_REWARD:Math.round(size*6+rand(0,6))});
}
function rockScreen(r){const p=proj(r.pos);if(!p)return null;return {x:p.x,y:p.y,r:r.size*F*p.w*1.05,w:p.w}}
function rockAt(gx,gy){
  let best=null,bd=1e9;
  for(const r of ROCKS){if(r.hit)continue;const s=rockScreen(r);if(!s)continue;
    const d=Math.hypot(gx-s.x,gy-s.y);if(d<Math.max(s.r+4,10)&&d<bd){bd=d;best=r}}
  return best;
}
// Free fire: click empty space and the lead ship shoots toward that spot (short cooldown so it can't be spammed).
let lastShot=-1;const COOLDOWN=.15;
function shooter(){const f=FLEET[(Math.random()*FLEET.length)|0],LO=LOADOUTS[f.slot],SC=SLOT_SCALE[f.slot];
  return {p:pose(f,T),guns:buildShip(LO).guns.map(g=>scl(g,SC)),col:paletteFor(LO).BOLT}}
function freeShot(gx,gy){
  if(T-lastShot<COOLDOWN)return;lastShot=T;const cz=180,S=shooter(),p=S.p;
  const to=add(CAM.pos,add(scl(CAM.f,cz),add(scl(CAM.r,(gx-W/2)*cz/F),scl(CAM.u,-(gy-H/2)*cz/F))));
  for(const g of S.guns)BOLTS.push({from:add(mulR(p.R,g),p.pos),to,t:0,dur:.35,col:S.col});
}
function shoot(r){
  lastShot=T;
  r.hit=true;const S=shooter(),p=S.p;
  for(const g of S.guns)BOLTS.push({from:add(mulR(p.R,g),p.pos),rock:r,t:0,dur:.28,col:S.col});
}
function explode(r){
  ROCKS=ROCKS.filter(x=>x!==r);CREDITS+=r.reward;
  for(let i=0;i<60+r.size*30;i++){const d=norm([rand(-1,1),rand(-1,1),rand(-1,1)]),sp=rand(2,9)*r.size*.5;
    DEBRIS.push({p:[...r.pos],v:scl(d,sp),a:0,L:rand(.5,1.2)*(r.gold?1.4:1),fire:Math.random()<.45,gold:r.gold})}
  const s=rockScreen(r);if(s){const rc=cv.getBoundingClientRect(),el=document.createElement('div');
    el.className=r.gold?'pop gold':'pop';el.textContent='+\u00a2'+r.reward;el.style.left=rc.left+s.x*SCALE+'px';el.style.top=rc.top+s.y*SCALE+'px';
    document.body.appendChild(el);setTimeout(()=>el.remove(),1400)}
  save();
}
function updateRocks(dt){
  rockT-=dt;if(rockT<=0){spawnRock();rockT=rand(40,90)}
  for(const r of ROCKS){r.pos[2]-=V*.55*dt;r.ang+=r.spin*dt}
  if(OWNED.optics)for(const r of ROCKS){if(r.hit)continue;const s=rockScreen(r);
    const on=s&&s.x>0&&s.y>0&&s.x<W&&s.y<H,cz=s?1/s.w:1e9;
    if(on&&cz<LOCK_RANGE){r.lockT=(r.lockT||0)+dt;
      const edge=s.x<W*.06||s.x>W*.94||s.y<H*.08||s.y>H*.92;   // about to leave the screen: take the shot now
      if((cz<FIRE_RANGE||edge)&&r.lockT>.6)shoot(r)}else r.lockT=0}
  ROCKS=ROCKS.filter(r=>{const s=rockScreen(r);return s&&1/s.w>4&&s.x>-s.r-20&&s.x<W+s.r+20&&s.y>-s.r-20&&s.y<H+s.r+20});
  for(const b of BOLTS){b.t+=dt;if(b.t>=b.dur&&!b.done){b.done=true;if(b.rock&&ROCKS.includes(b.rock))explode(b.rock)}}
  BOLTS=BOLTS.filter(b=>b.t<b.dur+.05);
  for(const q of DEBRIS){q.a+=dt;q.p[0]+=q.v[0]*dt;q.p[1]+=q.v[1]*dt;q.p[2]+=(q.v[2]-V*.55)*dt}
  DEBRIS=DEBRIS.filter(q=>q.a<q.L);
}
// red lock-on brackets that close in over the first half second, then hold and blink
function drawCrosshair(r){
  const s=rockScreen(r);if(!s)return;
  const k=Math.min(1,r.lockT/.5),h=Math.round(Math.max(5,s.r+3)+(1-k)*8),L=Math.max(2,Math.round(h*.45));
  const col=k<1||(T*4%1)<.7?XHAIR:XHAIR2,cx=Math.round(s.x),cy=Math.round(s.y);
  const px=(x,y)=>{if(x>=0&&y>=0&&x<W&&y<H)buf[y*W+x]=col};
  for(const [sx,sy] of [[-1,-1],[1,-1],[-1,1],[1,1]])for(let i=0;i<L;i++){px(cx+sx*h-sx*i,cy+sy*h);px(cx+sx*h,cy+sy*h-sy*i)}
}
function renderRocks(){
  for(const r of ROCKS){drawMesh(r.mesh,r.pos,axisRot(r.ax,r.ang),r.size);
    if(r.lockT>0&&!r.hit)drawCrosshair(r);
    if(!r.gold)continue;   // glints: a few pixels flash white on and around a gold asteroid
    const sc=rockScreen(r);if(!sc)continue;const n=2+(sc.r/4|0);
    for(let i=0;i<n;i++){const ph=(T*2.3+i*.618+r.size*7)%1;if(ph>.35)continue;
      const a=i*2.4+r.ang,d=sc.r*(.3+.8*((i*.37)%1)),x=sc.x+Math.cos(a)*d,y=sc.y+Math.sin(a)*d,c=GOLDC[5];
      plot(x,y,sc.w*1.5,c);if(ph<.15&&sc.r>3){plot(x+1,y,sc.w*1.5,GOLDC[4]);plot(x-1,y,sc.w*1.5,GOLDC[4]);plot(x,y+1,sc.w*1.5,GOLDC[4]);plot(x,y-1,sc.w*1.5,GOLDC[4])}}}
}
function renderFx(){
  for(const q of DEBRIS){const p=proj(q.p);if(!p)continue;const f=q.a/q.L,th=BAY[((p.x|0)&3)|(((p.y|0)&3)<<2)];
    const col=q.gold&&!q.fire?GOLDC[clamp(Math.floor((1-f)*6+th*.8),2,5)]:q.fire?EXH[clamp(Math.floor(f*EXH.length+th*.8),0,EXH.length-1)]:ROCKC[clamp(Math.floor((1-f)*5+th*.8),1,5)];
    const sz=Math.max(1,Math.round(.05*F*p.w));for(let y=0;y<sz;y++)for(let x=0;x<sz;x++)plot(p.x+x,p.y+y,p.w,col)}
  for(const b of BOLTS){if(b.t>b.dur)continue;
    const to=b.rock?b.rock.pos:b.to,f0=Math.max(0,b.t/b.dur-.25),f1=Math.min(1,b.t/b.dur);
    const A=proj(add(b.from,scl(sub(to,b.from),f0))),B=proj(add(b.from,scl(sub(to,b.from),f1)));if(!A||!B)continue;
    const dx=B.x-A.x,dy=B.y-A.y,n=Math.ceil(Math.max(Math.abs(dx),Math.abs(dy),1));
    const BC=b.col||BOLT;
    for(let i=0;i<=n;i++){const t=i/n,x=A.x+dx*t,y=A.y+dy*t,col=BC[t>.8?2:t>.4?1:0];
      if(x>=0&&y>=0&&x<W&&y<H){buf[(y|0)*W+(x|0)]=col;if(t>.5&&x+1<W)buf[(y|0)*W+(x|0)+1]=BC[0]}}}
}

function update(dt){
  T+=dt;
  if(FUEL>0)FUEL=Math.max(0,FUEL-dt/(cellHours()*3600));
  THR+=((FUEL>0?1:0)-THR)*Math.min(1,dt*.35);                 // engines spool down/up over a few seconds
  const cruise=(22+Math.sin(T*.03)*5)*(1+.15*engTier());V=COAST+(cruise-COAST)*THR;
  // engine glow: full burn at THR=1, a dim ember when empty, with the odd sputter
  engLvl=THR*4.6+(THR<.2&&Math.random()<.03?2.5:0);const km=V*KMS_PER_UNIT*dt;DIST+=km;CREDITS+=km/KM_PER_CREDIT;
  engFlick=Math.sin(T*47)*.35+(Math.random()-.5)*.5;
  const mx=DIRC[0]*V*dt,my=DIRC[1]*V*dt,mz=DIRC[2]*V*dt;
  for(let i=0;i<STARS.length;i++){const s=STARS[i];s.x-=mx;s.y-=my;s.z-=mz;
    const sx=W/2+s.x*F/s.z,sy=H/2-s.y*F/s.z;
    if(s.z<NEAR||sx<-2||sy<-2||sx>W+2||sy>H+2)STARS[i]=spawnStar(FAR)}
  // safety net: sweep the screen and drop a star onto any pixel that is close to going stale
  for(let n=0;n<1500;n++){scan=(scan+1)%cov.length;
    if(T-cov[scan]>STALE-45){const cz=rand(60,FAR);
      STARS[(Math.random()*STARS.length)|0]={x:((scan%W)+.5-W/2)*cz/F,y:-(((scan/W)|0)+.5-H/2)*cz/F,z:cz};cov[scan]=T-STALE+60;break}}
  for(const s of FLEET){
    const p=pose(s,T),back=mulR(p.R,[0,0,-1]),LO=LOADOUTS[s.slot],X=paletteFor(LO).EXH,SC=SLOT_SCALE[s.slot];
    for(const e of buildShip(LO).engines){
      const w=add(scl(mulR(p.R,[e[0],e[1],e[2]]),SC),p.pos);let n=(dt*70*e[3]*SC*4*(.03+.97*THR)+Math.random())|0;
      while(n--){const sp=rand(6,9)*(.3+.7*THR),j=e[3]*.6*SC;
        PARTS.push({p:[w[0]+rand(-j,j),w[1]+rand(-j,j),w[2]],v:[back[0]*sp+rand(-.4,.4),back[1]*sp+rand(-.4,.4),back[2]*sp],a:0,L:rand(.12,.3),c:X})}
    }
  }
  for(const q of PARTS){q.a+=dt;q.p[0]+=q.v[0]*dt;q.p[1]+=q.v[1]*dt;q.p[2]+=q.v[2]*dt}
  PARTS=PARTS.filter(q=>q.a<q.L);
  updateRocks(dt);
}

function render(){
  buf.fill(BLACK);zb.fill(0);
  const poses=FLEET.map(s=>pose(s,T));
  poses.forEach((p,i)=>{const LO=LOADOUTS[FLEET[i].slot];({MATS,ENGC}=paletteFor(LO));drawMesh(buildShip(LO),p.pos,p.R,SLOT_SCALE[FLEET[i].slot])});
  ({MATS,ENGC}=paletteFor(LOADOUTS[0]));
  renderRocks();
  for(const q of PARTS){const p=proj(q.p);if(!p)continue;
    const f=q.a/q.L,th=BAY[((p.x|0)&3)|(((p.y|0)&3)<<2)];
    const X=q.c||EXH,col=X[clamp(Math.floor(f*X.length+th*.8),0,X.length-1)];
    const sz=Math.max(1,Math.round(.045*F*p.w));
    for(let yy=0;yy<sz;yy++)for(let xx=0;xx<sz;xx++)plot(p.x+xx,p.y+yy,p.w,col)}
  // stars: single white pixels, 2x2 when close
  for(const s of STARS){
    const w=1/s.z,sx=W/2+s.x*F*w,sy=H/2-s.y*F*w;
    const col=STARC[s.z>300?0:s.z>170?1:2];
    plot(sx,sy,w,col);if(s.z<55){plot(sx+1,sy,w,col);plot(sx,sy+1,w,col);plot(sx+1,sy+1,w,col)}
  }
  renderFx();
  poses.forEach((p,i)=>{const LO=LOADOUTS[FLEET[i].slot],LC=paletteFor(LO).LIGHTC,SC=SLOT_SCALE[FLEET[i].slot];
   for(const L of buildShip(LO).lights){
    const on=L.blink===0||((T+L.blink*.4)%1.8)<.15;
    const s=proj(add(scl(mulR(p.R,L.p),SC),p.pos));if(!s)continue;
    plot(s.x,s.y,s.w*1.02,LC[on?2:0]);
    if(on&&L.blink)for(const [ox,oy] of [[1,0],[-1,0],[0,1],[0,-1]])plot(s.x+ox,s.y+oy,s.w*1.02,LC[1]);
  }});
  // coverage: remember when each pixel was last lit
  let stale=0;
  // coverage map: a heat map of how long each dark pixel has gone unlit (dark red = recent, bright red = near the limit, yellow = over it)
  let oldest=0;
  for(let i=0;i<buf.length;i++){if(buf[i]!==BLACK){cov[i]=T;continue}
    const age=cov[i]<0?STALE*2:T-cov[i];if(age>STALE)stale++;if(age>oldest)oldest=age;
    if(showCov&&age>3)buf[i]=age>STALE?0xff00e0ff:COVC[Math.min(63,(age/STALE*64)|0)]}
  if(showCov)hint.textContent=`Coverage: longest unlit ${Math.floor(oldest/60)}:${String(Math.floor(oldest%60)).padStart(2,'0')} of ${STALE/60}:00 · over limit ${(100*stale/buf.length).toFixed(2)}%`;
  ctx.putImageData(img,0,0);
}

let last=performance.now(),acc=0;
function frame(now){
  requestAnimationFrame(frame);
  const dt=Math.min(.1,(now-last)/1000);acc+=dt;last=now;
  if(acc<1/30-.002)return;             // 30 fps cap keeps it light for a screensaver
  const pdt=acc;if(!paused)update(acc);acc=0;render();hud(now);previewTick(pdt);
}
const hint=document.getElementById('hint');
addEventListener('resize',resize);resize();

// ---------- controls ----------
const $=id=>document.getElementById(id);
function fullscreen(){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen().catch(()=>{})}
function setMenu(open){document.body.classList.toggle('open',open);$('burger').setAttribute('aria-expanded',open)}
function syncMenu(){
  $('v-n').textContent=(FLEET.length-1)+'/'+wingOwned();
  $('v-cr').textContent='\u00a2'+nf.format(Math.floor(CREDITS));
  document.querySelector('[data-k="n"]').disabled=!wingOwned();
  if($('menu').classList.contains('shop'))renderShop();
  if($('menu').classList.contains('cust'))renderCust();
  $('v-p').textContent=paused?'Resume':'Pause';
  document.querySelector('[data-k="c"]').classList.toggle('on',showCov);
  document.querySelector('[data-k=" "]').classList.toggle('on',paused);
  $('hint').style.display=showCov?'block':'none';
}
function action(k){
  if(k==='f')fullscreen();
  else if(k===' ')paused=!paused;
  else if(k==='s'){setMenu(true);$('menu').classList.remove('shop');$('menu').classList.add('cust');renderCust.k=null}
  else if(k==='b'){setMenu(true);$('menu').classList.remove('cust');$('menu').classList.add('shop')}
  else if(k==='back')$('menu').classList.remove('shop','cust');
  else if(k==='$')CREDITS+=1000;   // dev: free credits for testing the shop
  else if(k==='g')spawnRock(true);  // dev: spawn a gold asteroid
  else if(k==='e')FUEL=Math.min(FUEL,.001);  // dev: nearly empty the tank (~7 s left)
  else if(k==='c')showCov=!showCov;
  else if(k==='n'){if(FLEET.length<=wingOwned())addWing();else FLEET.length=1}
  else if(k==='m')setMenu(!document.body.classList.contains('open'));
  else if(k==='escape'){const m=$('menu');if(m.classList.contains('shop')||m.classList.contains('cust'))m.classList.remove('shop','cust');else setMenu(false)}
  else return false;
  syncMenu();return true;
}
addEventListener('keydown',e=>{if(action(e.key.toLowerCase()))e.preventDefault()});
$('burger').addEventListener('click',()=>action('m'));
$('menu').addEventListener('click',e=>{const b=e.target.closest('button[data-k]');if(b){action(b.dataset.k);b.blur();return}
  const f=e.target.closest('button[data-fighter]');if(f){EDIT=+f.dataset.fighter;renderCust.k=renderShop.k=null;syncMenu();f.blur();return}
  const q=e.target.closest('button[data-equip]');if(q){const it=SHOP.find(x=>x.id===q.dataset.equip);EQUIP[it.kind](it.key);save();renderCust.k=renderShop.k=null;syncMenu();q.blur();return}
  const t=e.target.closest('button[data-tab]');if(t){SHOP_TAB=t.dataset.tab;SHOP_SEL=null;renderShop.k=null;renderShop();return}
  const u=e.target.closest('button[data-buy]');if(u){const it=SHOP.find(x=>x.id===u.dataset.buy);if(it&&it.kind)SHOP_SEL=it.id;buy(u.dataset.buy);return}
  const c=e.target.closest('.item.pick');if(c){SHOP_SEL=c.dataset.id;renderShop.k=null;renderShop()}});
function addWing(){FLEET.push({slot:FLEET.length,ph:rand(0,50)})}
function buy(id){
  const it=SHOP.find(x=>x.id===id);
  if(it&&it.repeat){if(FUEL>FUEL_MAX-1+1e-6||CREDITS<it.price)return;CREDITS-=it.price;FUEL=Math.min(FUEL_MAX,FUEL+1);save();syncMenu();return}
  if(it&&it.kind&&owns(it)){EQUIP[it.kind](it.key);save();renderShop.k=null;syncMenu();return}   // owned cosmetic: equip it
  if(!it||OWNED[id]||(it.req&&!OWNED[it.req])||CREDITS<it.price)return;
  CREDITS-=it.price;OWNED[id]=true;
  if(id.startsWith('wing'))while(FLEET.length<=wingOwned())addWing();
  if(it.kind)EQUIP[it.kind](it.key);   // new cosmetics equip right away
  renderShop.k=null;
  save();syncMenu();
}
function renderShop(){
  $('s-cr').textContent=nf.format(Math.floor(CREDITS));$('s-for').textContent='Equips to: '+SLOT_NAMES[EDIT];
  const key=SHOP.map(it=>(OWNED[it.id]?'o':'')+(CREDITS<it.price?'p':'')).join()+JSON.stringify(cur())+EDIT+SHOP_SEL+(FUEL>FUEL_MAX-1?'F':'')+SHOP_TAB;if(key===renderShop.k)return;renderShop.k=key;
  $('tabs').innerHTML=SHOP_TABS.map(([id,n])=>`<button role="tab" data-tab="${id}" aria-selected="${id===SHOP_TAB}">${n}</button>`).join('');
  $('items').innerHTML=SHOP.filter(it=>it.cat===SHOP_TAB).sort((a,b)=>a.price-b.price||(a.ord||0)-(b.ord||0)).map(it=>{   // ord breaks price ties
    const own=owns(it),lock=it.req&&!OWNED[it.req],poor=CREDITS<it.price,full=it.repeat&&FUEL>FUEL_MAX-1;
    const cos=!!it.kind,eq=cos&&own&&equipped(it);
    const label=cos&&own?(eq?'Equipped':'Equip'):own?'Owned':full?'Tank full':lock?'Locked':'\u00a2'+nf.format(it.price);
    const dis=cos&&own?eq:own||lock||poor||full;
    return `<div class="item${own&&!cos?' owned':''}${eq?' eq':''}${cos?' pick':''}${SHOP_SEL===it.id?' sel':''}" data-id="${it.id}"><div class="nm">${swatch(it)}${it.name}</div><div class="ds">${it.desc}${it.repeat?' Lasts '+cellHours()+' hours.':''}${lock?' Requires '+SHOP.find(x=>x.id===it.req).name+'.':''}</div>`+
      `<button data-buy="${it.id}"${dis?' disabled':''}>${label}</button></div>`}).join('');
}
// Customize view: everything you own, grouped, one click to equip
function renderCust(){
  const key=JSON.stringify(cur())+EDIT+wingOwned()+SHOP.filter(owns).length;if(key===renderCust.k)return;renderCust.k=key;
  const pick=`<h3>FIGHTER</h3><div class="fsel">`+SLOT_NAMES.map((n,i)=>{const lock=i>wingOwned();
    return `<button data-fighter="${i}" aria-pressed="${i===EDIT}"${lock?' disabled title="Buy this wingman in the shop"':''}>${n}</button>`}).join('')+`</div>`+
    (wingOwned()<2?`<div class="fnote">${wingOwned()?'Wing 2 locked: buy it in Fleet':'Wingmen locked: buy them in Fleet'}</div>`:'');
  $('cust').innerHTML=pick+[...SLOT_KEYS.map(([k,,t])=>[k,t]),['skin','PAINT'],['exhaust','EXHAUST'],['laser','LASERS']].map(([kind,title])=>
    `<h3>${title}</h3>`+SHOP.filter(it=>it.kind===kind&&owns(it)).map(it=>
      `<button data-equip="${it.id}" aria-pressed="${equipped(it)}">${swatch(it)}${it.name}</button>`).join('')).join('');
}
function swatch(it){
  if(!['skin','exhaust','laser'].includes(it.kind))return '';
  const c=it.kind==='skin'?[SKINS[it.key].hull[4],SKINS[it.key].panel[4],SKINS[it.key].light[1]]:it.kind==='exhaust'?[EXHAUSTS[it.key].eng[1],EXHAUSTS[it.key].exh[2],EXHAUSTS[it.key].exh[4]]:[LASERS[it.key][0],LASERS[it.key][1]];
  return `<span class="sw">${c.map(x=>`<i style="background:${x}"></i>`).join('')}</span>`;
}
function toGame(e){const rc=cv.getBoundingClientRect();return [(e.clientX-rc.left)/SCALE,(e.clientY-rc.top)/SCALE]}
cv.addEventListener('click',e=>{
  if(document.body.classList.contains('open')){setMenu(false);return}
  if(paused)return;const g=toGame(e),r=rockAt(...g);if(r)shoot(r);else freeShot(...g);
});
cv.style.cursor='crosshair';
let idleT;function wake(){document.body.classList.remove('idle');clearTimeout(idleT);idleT=setTimeout(()=>document.body.classList.add('idle'),2500)}
addEventListener('mousemove',wake);wake();
const nf=new Intl.NumberFormat('en-US');
if(skinsOwned().includes(SAVED.skin))applySkin(SAVED.skin);
{const ex=SAVED.exhaust||(SAVED.skin==='blue'&&OWNED.exh_ion?'ion':'flame');const it=SHOP.find(x=>x.kind==='exhaust'&&x.key===ex);if(it&&owns(it))applyExhaust(ex)}
{const it=SHOP.find(x=>x.kind==='laser'&&x.key===SAVED.laser);if(it&&owns(it))applyLaser(SAVED.laser)}
if(SAVED.ship)for(const [slot] of SLOT_KEYS){const it=SHOP.find(x=>x.kind===slot&&x.key===SAVED.ship[slot]);if(it&&owns(it))applyPart(slot,it.key)}
// lead comes from the saved lead settings above; wingmen from their own saved loadouts, or a copy of the lead (older saves)
{const lead={...SHIPCFG,skin:SKIN,exhaust:EXHAUST,laser:LASER},sl=SAVED.loadouts||[];
 LOADOUTS=[cleanLoad(sl[0]||lead,lead),cleanLoad(sl[1]||lead,lead),cleanLoad(sl[2]||lead,lead)];syncLead()}
while(FLEET.length<=Math.min(SAVED.wing,wingOwned()))addWing();
syncMenu();

// ---------- shop preview ----------
// A turntable view of your ship with the selected shop item swapped in (a ship part, paint, exhaust or laser).
// It reuses the main rasterizer by briefly pointing its globals at a small preview buffer.
const PV={W:170,H:120,t:0,rot:0,playing:true,ff:false,rw:false,shot:0,parts:[],bolts:[],cache:{}};
{const c=$('pv-cv');c.width=PV.W;c.height=PV.H;PV.ctx=c.getContext('2d');PV.img=PV.ctx.createImageData(PV.W,PV.H);
 PV.buf=new Uint32Array(PV.img.data.buffer);PV.zb=new Float32Array(PV.W*PV.H)}
function pvPalette(c){
  const k=c.skin+'|'+c.exhaust+'|'+c.laser;if(PV.cache[k])return PV.cache[k];
  const S=SKINS[c.skin],E=EXHAUSTS[c.exhaust];
  return PV.cache[k]={MATS:{rock:ROCKC,gold:GOLDC,hull:ramp(S.hull),panel:ramp(S.panel),trim:ramp(S.trim),glass:ramp(S.glass)},LIGHTC:ramp(S.light),
    ENGC:ramp([shade(E.eng[0],.12),shade(E.eng[0],.25),shade(E.eng[0],.48),...E.eng]),EXH:ramp(E.exh),BOLT:ramp(LASERS[c.laser])};
}
function pvSync(){document.querySelector('[data-pv="play"]').setAttribute('aria-pressed',PV.playing);document.querySelector('[data-pv="pause"]').setAttribute('aria-pressed',!PV.playing)}
$('preview').addEventListener('click',e=>{const b=e.target.closest('[data-pv]');if(!b)return;
  if(b.dataset.pv==='play')PV.playing=true;else if(b.dataset.pv==='pause')PV.playing=false;pvSync()});
// hold-to-spin buttons: fast forward and rewind
for(const k of ['ff','rw']){const b=document.querySelector(`[data-pv="${k}"]`),on=v=>e=>{PV[k]=v;b.setAttribute('aria-pressed',v);if(v)b.setPointerCapture?.(e.pointerId)};
 b.addEventListener('pointerdown',on(true));for(const ev of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(ev,on(false))}
function previewTick(dt){
  const on=document.body.classList.contains('open')&&$('menu').classList.contains('shop')&&COSMETIC_TABS.includes(SHOP_TAB);
  document.body.classList.toggle('pv',on);if(!on)return;
  PV.t+=Math.min(dt,.1);
  // turntable: Play turns it slowly, Pause freezes the pose, holding Fast forward / Rewind spins it quickly either way
  PV.rot+=Math.min(dt,.1)*((PV.playing?1:0)+(PV.ff?6:0)-(PV.rw?7:0));   // rewind outruns play so it always turns backwards
  const c={...cur()},sel=SHOP.find(x=>x.id===SHOP_SEL);
  if(sel&&sel.kind)c[sel.kind]=sel.key;
  // label
  if(sel&&sel.kind){const own=owns(sel);$('pv-nm').textContent=sel.name;
    const pr=$('pv-pr');pr.className=!own&&CREDITS<sel.price?'poor':'';
    pr.textContent=own?(equipped(sel)?'Equipped':'Owned'):CREDITS<sel.price?`¢${nf.format(sel.price)} (need ¢${nf.format(Math.ceil(sel.price-CREDITS))} more)`:`¢${nf.format(sel.price)}`;}
  else{$('pv-nm').textContent=SLOT_NAMES[EDIT]+' loadout';$('pv-pr').textContent='Click an item to preview it';$('pv-pr').className=''}
  // swap the renderer over to the preview buffer
  const sv={W,H,F,buf,zb,MATS,ENGC,EXH,LIGHTC,BOLT,engLvl,THR,engFlick,cp:CAM.pos,cf:CAM.f,cr:CAM.r,cu:CAM.u};
  const P=pvPalette(c),M=buildShip(c);
  W=PV.W;H=PV.H;F=H*1.4;buf=PV.buf;zb=PV.zb;({MATS,ENGC,EXH,LIGHTC,BOLT}=P);engLvl=4.6;THR=1;engFlick=Math.sin(PV.t*47)*.35+(Math.random()-.5)*.5;
  CAM.pos=[0,2.8,-8.6];CAM.f=norm(sub([0,0,0],CAM.pos));CAM.r=norm(cross([0,1,0],CAM.f));CAM.u=cross(CAM.f,CAM.r);
  try{
    buf.fill(BLACK);zb.fill(0);
    for(let i=0;i<30;i++){const x=(i*73)%W,y=(i*41+((PV.t*6*(1+i%3))|0))%H;buf[y*W+x]=STARC[i%3]}   // a few drifting background stars
    const R=euler(PV.rot*.6,Math.sin(PV.rot*.4)*.08,Math.sin(PV.rot*.7)*.15),pos=[0,0,0];
    drawMesh(M,pos,R);
    const back=mulR(R,[0,0,-1]);
    for(const e of M.engines){const w=add(mulR(R,[e[0],e[1],e[2]]),pos);let n=(dt*70*e[3]*4+Math.random())|0;
      while(n--){const sp=rand(5,8),j=e[3]*.6;PV.parts.push({p:[w[0]+rand(-j,j),w[1]+rand(-j,j),w[2]+rand(-j,j)],v:scl(back,sp),a:0,L:rand(.12,.3)})}}
    for(const q of PV.parts){q.a+=dt;q.p=add(q.p,scl(q.v,dt))}
    PV.parts=PV.parts.filter(q=>q.a<q.L);
    for(const q of PV.parts){const p=proj(q.p);if(!p)continue;const f=q.a/q.L,th=BAY[((p.x|0)&3)|(((p.y|0)&3)<<2)];
      const col=EXH[clamp(Math.floor(f*EXH.length+th*.8),0,EXH.length-1)],sz=Math.max(1,Math.round(.045*F*p.w));
      for(let yy=0;yy<sz;yy++)for(let xx=0;xx<sz;xx++)plot(p.x+xx,p.y+yy,p.w,col)}
    // fire a pair of bolts every 1.4 s so laser colors show
    PV.shot-=dt;if(PV.shot<=0){PV.shot=1.4;for(const g of M.guns)PV.bolts.push({from:mulR(R,g),to:mulR(R,[g[0],g[1],30]),t:0})}
    for(const b of PV.bolts){b.t+=dt;const f0=Math.max(0,b.t/.45-.25),f1=Math.min(1,b.t/.45);
      const A=proj(add(b.from,scl(sub(b.to,b.from),f0))),B=proj(add(b.from,scl(sub(b.to,b.from),f1)));if(!A||!B)continue;
      const dx=B.x-A.x,dy=B.y-A.y,n=Math.ceil(Math.max(Math.abs(dx),Math.abs(dy),1));
      for(let i=0;i<=n;i++){const t=i/n;plot(A.x+dx*t,A.y+dy*t,Math.max(A.w,B.w),BOLT[t>.8?2:t>.4?1:0])}}
    PV.bolts=PV.bolts.filter(b=>b.t<.45);
    for(const L of M.lights){const on=L.blink===0||((PV.t+L.blink*.4)%1.8)<.15;const sp=proj(add(mulR(R,L.p),pos));if(sp)plot(sp.x,sp.y,sp.w*1.02,LIGHTC[on?2:0])}
    PV.ctx.putImageData(PV.img,0,0);
  }finally{({W,H,F,buf,zb,MATS,ENGC,EXH,LIGHTC,BOLT,engLvl,THR,engFlick}=sv);CAM.pos=sv.cp;CAM.f=sv.cf;CAM.r=sv.cr;CAM.u=sv.cu}
}

// ---------- HUD ----------
// The readout drifts a few pixels over several minutes so its text never sits on the exact same pixels (OLED).
let hudT=0,saveT=0;
function hud(now){
  if(now-hudT<250)return;hudT=now;
  $('h-spd').textContent=(V*KMS_PER_UNIT).toFixed(1);
  $('h-dst').textContent=nf.format(Math.floor(DIST));
  $('h-cr').textContent=nf.format(Math.floor(CREDITS));
  const fe=$('fuel'),cells=fe.querySelectorAll('i'),low=FUEL<1;
  cells.forEach((c,i)=>{const f=clamp(FUEL-i,0,1)*100,col=low?'#d04030':'#c8a040';c.style.background=`linear-gradient(90deg,${col} ${f}%,#16161c ${f}%)`});
  fe.classList.toggle('low',low);fe.classList.toggle('empty',FUEL<=0);
  $('f-st').textContent=FUEL<=0?'EMPTY':Math.ceil(FUEL/FUEL_MAX*100)+'%';
  if(document.body.classList.contains('open'))syncMenu();
  const x=Math.sin(now/1e3*TAU/211)*10,y=Math.sin(now/1e3*TAU/157)*5;
  $('hud').style.transform=`translate(calc(-50% + ${x.toFixed(1)}px),${y.toFixed(1)}px)`;
  $('fuel').style.transform=`translate(calc(-50% + ${(-x).toFixed(1)}px),${(-y).toFixed(1)}px)`;
  if(now-saveT>5000){saveT=now;save()}
}
addEventListener('pagehide',save);
