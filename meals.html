function badge(m){return m.orig ? `<span class="mp-orig-badge">Original</span>` : ""}

function renderHome(){
  const days = SCHEDULE.map(([d,b,l,dn])=>{
    const bm = byCode[b], lm = byCode[l], dm = byCode[dn];
    return `<tr><td><b>${d}</b></td><td><a href="#meal/${bm.id}">${bm.name}</a></td><td><a href="#meal/${lm.id}">${lm.name}</a></td><td><a href="#meal/${dm.id}">${dm.name}</a></td></tr>`;
  }).join("");
  app.innerHTML = `

  for(const cat of cats){
    rows += `<tr class="mp-cat"><td colspan="5"><div class="mp-cat-label">${cat}s</div></td></tr>`;
    for(const m of MEALS.filter(m=>m.cat===cat)){
      rows += `<tr>
        <td class="mp-num"><b>${m.code}</b></td>
        <td><a href="#meal/${m.id}">${m.name}</a>${badge(m)}</td>
        <td class="mp-kcal">${m.kcal} kcal</td>
        <td class="mp-num">${m.p}P / ${m.c}C / ${m.f}F</td>
        <td>${m.flavor}</td></tr>`;
    }
  }
  app.innerHTML = `
    <div class="mp-pagehead"><h2>All Meals</h2><p>Tap any meal for the full recipe and a nutrition panel. Macros are estimates; weigh proteins raw.</p></div>
    <table class="mp-table">
      <thead><tr><th>#</th><th>Meal</th><th>Calories</th><th>Macros (g)</th><th>Flavor profile</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>`;
}

const CATPAGES = {
  breakfasts:{cat:"Breakfast",title:"Breakfasts",blurb:"Five options, ~300–320 kcal each. Rotate freely. Originals are tagged."},
  lunches:{cat:"Lunch",title:"Lunches",blurb:"Five options, ~330–360 kcal — all fridge + microwave + toaster oven/air fryer friendly."},
  dinners:{cat:"Dinner",title:"Dinners",blurb:"Eleven options, ~450–490 kcal, each with a distinct flavor profile. Seven rotate in per week."},
  snacks:{cat:"Snack",title:"Snacks",blurb:"Pick 1 savory + 1 sweet per day (~280–310 kcal total)."}
};

function renderCategory(key){
  const cfg = CATPAGES[key];
  const cards = MEALS.filter(m=>m.cat===cfg.cat).map(m=>`
    <a class="mp-tile" href="#meal/${m.id}">
      <div class="mp-eyebrow">${m.code} · ${m.kcal} kcal · ${m.p}P/${m.c}C/${m.f}F</div>
      <h3>${m.name}${badge(m)}</h3>
      <p>${m.flavor}</p>
      <span class="mp-go">Open recipe →</span>
    </a>`).join("");
  app.innerHTML = `
    <div class="mp-pagehead"><h2>${cfg.title}</h2><p>${cfg.blurb}</p></div>
    <section class="mp-tiles">${cards}</section>`;
}

// ---------- randomize page ----------
const RAND_CATS = ["Breakfast","Lunch","Dinner","Snack"];
const randPicks = {};      // current single pick per category
let randWeek = null;       // generated weekly table

function shuffle(a){
  a = a.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

function randPick(cat){
  const pool = MEALS.filter(m=>m.cat===cat && m !== randPicks[cat]);
  randPicks[cat] = pool[Math.floor(Math.random()*pool.length)];
}

// Fill 7 days from a pool with no repeats; if pool < 7, every option is used
// once before any repeat, and no two consecutive days match.
function weekColumn(cat){
  const pool = MEALS.filter(m=>m.cat===cat);
  const out = [];
  while(out.length < 7){
    let batch = shuffle(pool);
    if(out.length && batch[0] === out[out.length-1]){
      [batch[0], batch[batch.length-1]] = [batch[batch.length-1], batch[0]];
    }
    out.push(...batch);
  }
  return out.slice(0,7);
}

function makeWeek(){
  const b = weekColumn("Breakfast"), l = weekColumn("Lunch"), d = weekColumn("Dinner");
  const days = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
  randWeek = days.map((day,i)=>[day, b[i], l[i], d[i]]);
}

function slotHTML(cat){
  const m = randPicks[cat];
  const pick = m
    ? `<a href="#meal/${m.id}">${m.name}</a>${badge(m)}<span class="mp-meta">${m.code} · ${m.kcal} kcal · ${m.p}P/${m.c}C/${m.f}F</span>`
    : `<span class="mp-meta">Hit the button to draw a ${cat.toLowerCase()}.</span>`;
  return `<div class="mp-rand-slot">
    <h3>${cat}</h3>
    <div class="mp-pick">${pick}</div>
    <button class="mp-btn" data-rand="${cat}">Randomize ↻</button>
  </div>`;
}

function renderRandomize(){
  const slots = RAND_CATS.map(slotHTML).join("");
  let weekTable = "";
  if(randWeek){
    const rows = randWeek.map(([day,b,l,d])=>`<tr><td><b>${day}</b></td>
      <td><a href="#meal/${b.id}">${b.name}</a>${badge(b)}</td>
      <td><a href="#meal/${l.id}">${l.name}</a>${badge(l)}</td>
      <td><a href="#meal/${d.id}">${d.name}</a>${badge(d)}</td></tr>`).join("");
    weekTable = `<table class="mp-table">
      <thead><tr><th>Day</th><th>Breakfast</th><th>Lunch</th><th>Dinner</th></tr></thead>
      <tbody>${rows}</tbody></table>`;
  } else {
    weekTable = `<p style="margin:20px 0 64px;color:rgba(255,255,255,0.6)">No week generated yet — hit the button.</p>`;
  }
  app.innerHTML = `
    <div class="mp-pagehead"><h2>Randomize</h2><p>Draw a single dish per meal, or generate a full week. Dinners never repeat in a week; breakfasts and lunches cycle through every option before repeating, never twice in a row.</p></div>
    <div class="mp-rand-grid">${slots}</div>
    <div class="mp-rand-head">
      <div class="mp-pagehead" style="padding:0"><h2>Random Week</h2></div>
      <button class="mp-btn mp-dark" id="genweek">Generate Week ⚄</button>
    </div>
    ${weekTable}`;
  app.querySelectorAll("[data-rand]").forEach(btn=>btn.addEventListener("click",()=>{
    randPick(btn.dataset.rand); renderRandomize();
  }));
  document.getElementById("genweek").addEventListener("click",()=>{
    makeWeek(); renderRandomize();
  });
}

function renderGrocery(){
  const aisles = GROCERY.map(([name,items])=>`
    <div class="mp-aisle"><h3>${name}</h3><ul>
      ${items.map(([it,q])=>`<li><span>${esc(it)}</span><span class="mp-qty">${esc(q)}</span></li>`).join("")}
    </ul></div>`).join("");
  app.innerHTML = `
    <div class="mp-pagehead"><h2>Master Grocery List</h2><p>One weekly run covers all 27 meals. Spinach, cherry tomatoes, broccoli, rice, and Greek yogurt each work across 3+ meals.</p></div>
    <div class="mp-grocery">${aisles}</div>`;
}

function renderMeal(id){
  const m = MEALS.find(x=>x.id===id);
  if(!m){renderHome();return}

  const ingRows = m.ing.map(([i,q,kcal,p,c,f],idx)=>`
    <li class="mp-ing-row" data-idx="${idx}">
      <label>
        <input type="checkbox" class="mp-ing-check" data-idx="${idx}" checked>
        <span class="mp-ing-text"><b>${esc(q)}</b> — ${esc(i)}</span>
      </label>
    </li>`).join("");

  app.innerHTML = `
    <a class="mp-backlink" href="#meals">← All meals</a>
    <div class="mp-pagehead">
      <div class="mp-eyebrow">${m.code} · ${m.cat}${badge(m)}</div>
      <h2>${m.name}</h2>
      <span class="mp-flavor-tag">${m.flavor}</span>
    </div>
    <div class="mp-meal-grid">
      <div class="mp-recipe">
        <h3>Ingredients <span class="mp-ing-hint">untick to see the effect on nutrition</span></h3>
        <ul class="mp-ing-list">${ingRows}</ul>
        <h3>Method</h3>
        <ol>${m.steps.map(s=>`<li>${esc(s)}</li>`).join("")}</ol>
      </div>
      <aside class="mp-facts" aria-label="Nutrition facts">
        <div class="mp-nf-title">Nutrition Facts</div>
        <div class="mp-nf-serv">1 serving · live estimate</div>
        <div class="mp-nf-cal"><span class="mp-lbl">Calories</span><span class="mp-val" id="nf-kcal">0</span></div>
        <div class="mp-nf-row"><b>Protein</b><span id="nf-p">0 g</span></div>
        <div class="mp-nf-row"><b>Carbohydrates</b><span id="nf-c">0 g</span></div>
        <div class="mp-nf-row"><b>Fat</b><span id="nf-f">0 g</span></div>
        <div class="mp-macro-split" role="img" id="nf-split" aria-label="Macro split by grams">
          <div class="mp-p" id="nf-split-p"></div><div class="mp-c" id="nf-split-c"></div><div class="mp-f" id="nf-split-f"></div>
        </div>
        <div class="mp-split-key"><span class="mp-kp"><i></i>Protein</span><span class="mp-kc"><i></i>Carbs</span><span class="mp-kf"><i></i>Fat</span></div>
        <div class="mp-nf-note">Raw weights for proteins. Values are estimates and vary by brand. Untick an ingredient above to see its impact.</div>
      </aside>
    </div>`;

  function recompute(){
    let kcal=0,p=0,c=0,f=0;
    app.querySelectorAll(".mp-ing-check").forEach(cb=>{
      const idx = +cb.dataset.idx;
      const row = cb.closest(".mp-ing-row");
      const [,,ik,ip,ic,iff] = m.ing[idx];
      if(cb.checked){
        kcal += ik; p += ip; c += ic; f += iff;
        row.classList.remove("mp-ing-off");
      } else {
        row.classList.add("mp-ing-off");
      }
    });
    document.getElementById("nf-kcal").textContent = Math.round(kcal);
    document.getElementById("nf-p").textContent = Math.round(p) + " g";
    document.getElementById("nf-c").textContent = Math.round(c) + " g";
    document.getElementById("nf-f").textContent = Math.round(f) + " g";
    const total = (p + c + f) || 1;
    document.getElementById("nf-split-p").style.width = (p/total*100) + "%";
    document.getElementById("nf-split-c").style.width = (c/total*100) + "%";
    document.getElementById("nf-split-f").style.width = (f/total*100) + "%";
    const splitEl = document.getElementById("nf-split");
    splitEl.setAttribute("aria-label", `Macro split: protein ${(p/total*100).toFixed(0)}%, carbs ${(c/total*100).toFixed(0)}%, fat ${(f/total*100).toFixed(0)}% by grams`);
  }

  app.querySelectorAll(".mp-ing-check").forEach(cb=>{
    cb.addEventListener("change", recompute);
  });
  recompute();
}

function route(){
  const h = location.hash.replace(/^#/,"") || "home";
  let navKey = h;
  if(h.startsWith("meal/")){
    const m = MEALS.find(x=>x.id===h.slice(5));
    navKey = m ? {Breakfast:"breakfasts",Lunch:"lunches",Dinner:"dinners",Snack:"snacks"}[m.cat] : "meals";
  }
  document.querySelectorAll("[data-nav]").forEach(a=>{
    a.classList.toggle("active", navKey===a.dataset.nav);
  });
  if(h==="home") renderHome();
  else if(h==="meals") renderMeals();
  else if(h==="grocery") renderGrocery();
  else if(h==="randomize") renderRandomize();
  else if(CATPAGES[h]) renderCategory(h);
  else if(h.startsWith("meal/")) renderMeal(h.slice(5));
  else renderHome();
  window.scrollTo(0,0);
}
window.addEventListener("hashchange",route);
route();
</script>
</body>
</html>
